<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Верстак">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171b" media="(prefers-color-scheme: dark)">
<!-- both themes: the system's own controls (the slider, the date picker) follow the page's -->
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Верстак</title>
<style>
:root {
  --bg: #f6f3ee; --card: #fffdf9; --line: #e6e0d6; --text: #24211d; --muted: #8a8278;
  --accent: #c2603d; --accent-text: #fff; --danger: #b3261e;
  /* the height of the player and the tabs, measured in the script; this is the tabs alone */
  --bottom: calc(65px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17171b; --card: #222228; --line: #303038; --text: #ecebe8; --muted: #8f8d97;
          --accent: #e58a62; --accent-text: #1a1110; --danger: #ff8a80; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) 16px calc(var(--bottom) + 16px);
  max-width: 640px; margin: 0 auto;
}
.head { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 12px; }
h2 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
button, .add { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.add { background: var(--accent); color: var(--accent-text); padding: 11px 18px; border-radius: 999px; font-weight: 600; }
#empty, #pempty { color: var(--muted); text-align: center; margin-top: 18vh; padding: 0 24px; }
ul { list-style: none; margin: 0; padding: 0; }
li {
  display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 4px 8px 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px;
}
li.on { border-color: var(--accent); }
.play {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--line); color: var(--text);
}
li.on .play { background: var(--accent); color: var(--accent-text); }
.body { flex: 1; min-width: 0; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { color: var(--muted); font-size: 13px; }
/* the rename field sits in the name's line: the text stays where it was and the row keeps its height */
.name:has(input) { overflow: visible; }
.name input {
  display: block; font: inherit; width: calc(100% + 8px); height: 23px; padding: 0 4px; margin: 0 -4px; border: 0;
  border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--accent); outline: none; background: var(--bg); color: var(--text);
}
.tool { flex: none; width: 44px; height: 44px; color: var(--muted); border-radius: 10px; font-size: 18px;
        display: grid; place-items: center; }
/* A track row slides left over «Переименовать» and «Удалить» (render, swipe) */
#list li { display: block; position: relative; overflow: hidden; padding: 0; }
.front {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 8px 12px;
  background: var(--card); transition: transform .2s ease-out; touch-action: pan-y; -webkit-user-select: none; user-select: none;
}
/* --acts: the buttons' width, measured as a swipe starts: «Переименовать» at 11 pt is wider than 72 pt */
#list li.open .front { transform: translateX(calc(-1 * var(--acts, 144px))); }
.acts { position: absolute; top: 0; right: 0; bottom: 0; display: flex; }
.acts button {
  flex: none; min-width: 72px; padding: 0 6px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 600; background: var(--line); color: var(--text);
}
.acts .del { background: var(--danger); color: var(--bg); }  /* white on the dark theme's light red is unreadable */
/* bottom up: the home indicator, the tabs, the player while a track is open */
#bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; }
#player { background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px 2px; }
#player .row, #player .seek { max-width: 608px; margin: 0 auto; }
#player .row { display: flex; align-items: center; gap: 12px; }
#player .play { background: var(--accent); color: var(--accent-text); }
#player .seek { position: relative; }
/* a 44 pt target; the track is 4 pt in the middle of it */
#seek { position: relative; z-index: 1; display: block; width: 100%; height: 44px; margin: 0; accent-color: var(--accent); }
/* the A–B stretch 6 pt under the track, under the thumb; 14px is half the thumb, where the track starts and ends */
#band { position: absolute; top: 30px; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; }
#time { font-variant-numeric: tabular-nums; }
.tool.loop { width: auto; min-width: 56px; padding: 0 10px; font-size: 15px; font-weight: 600; color: var(--text); }
.tool.loop.a { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tool.loop.ab { background: var(--accent); color: var(--accent-text); }
#tabs {
  display: flex; gap: 6px; padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
  background: var(--bg); border-top: 1px solid var(--line);
}
#tabs button {
  flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 600; color: var(--muted);
}
#tabs button[aria-selected="true"] { color: var(--accent); }
#tabs svg { width: 24px; height: 24px; }
#toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--bottom) + 10px); margin: 0 auto; z-index: 4;
  max-width: 480px; background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 12px;
  font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
#toast.show { opacity: 1; }
#toast.act { padding: 4px 4px 4px 14px; }
#toast.show.act { pointer-events: auto; }
#undo { flex: none; min-height: 44px; padding: 0 10px; color: var(--bg); font-weight: 600; }
/* a toast in two lines (toast()): neither wraps, a name in it is cut short; the same height for any name */
#said { min-width: 0; }
#said.two div { display: flex; overflow: hidden; white-space: nowrap; }
#said.two b { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
#toast.act #said.two { padding: 6px 0; }
#usage { color: var(--muted); font-size: 13px; text-align: center; margin-top: 16px; }
svg { width: 18px; height: 18px; fill: currentColor; }
/* Цветы */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 4px; padding: 4px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; position: relative; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); font-size: 15px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
/* a 44 pt target around the 36 pt chip */
.chip::after { content: ""; position: absolute; inset: -4px; }
.chip .n { color: var(--muted); font-size: 13px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.on .n { color: inherit; opacity: .7; }
.sortrow { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.sortb { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; color: var(--text); }
.sortb svg.i { width: 16px; height: 16px; }
.group { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.group .r {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px;
  padding: 0 12px; text-align: left;
}
.group > * + :is(.r, .opts) { border-top: 1px solid var(--line); }
.k { flex: none; color: var(--muted); font-size: 15px; }
#plants li { padding-right: 10px; }
#plants .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pic {
  flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  background: var(--line); color: var(--muted);
}
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.meta b { color: var(--accent); font-weight: 600; }
.water {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--line); color: var(--muted);
}
li.due .water { border-color: var(--accent); color: var(--accent); }
li.done .water { background: var(--line); border-color: var(--line); color: var(--text); }
/* the plant card: a sheet from the bottom over everything; the page under it stays put (body.locked) */
body.locked { position: fixed; left: 0; right: 0; overflow: hidden; }
/* the bars are under the sheet then: the toast goes to the bottom, over the sheet's end */
body.locked #toast { bottom: calc(env(safe-area-inset-bottom) + 10px); }
/* while it shows, the sheet's end can scroll up past it: --toast is its height, set in toast() */
body.locked:has(#toast.show) .panel { padding-bottom: calc(16px + env(safe-area-inset-bottom) + var(--toast, 0px)); }
#sheet { position: fixed; inset: 0; z-index: 3; }
.dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); }
.panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto;
  max-height: calc(100% - env(safe-area-inset-top) - 8px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 16px 16px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  animation: rise .25s ease-out;
}
@keyframes rise { from { transform: translateY(100%); } }
/* let go after a swipe down: the sheet goes back up or away (pull) */
#sheet.let .panel { transition: transform .25s ease-out; }
#sheet.let .dim { transition: opacity .25s ease-out; }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } #sheet.let :is(.panel, .dim) { transition: none; } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-right: -12px; }
.shead h3 { margin: 0; font-size: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shead .tool { color: var(--text); }
.photo { position: relative; margin-top: 8px; }
/* the photo takes no touches: held, iOS lifts it for drag-and-drop and a slow swipe down there is lost */
.photo img { display: block; width: 100%; height: 200px; object-fit: cover; border-radius: 14px; pointer-events: none; }
.photo label {
  position: absolute; right: 8px; bottom: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px;
  background: var(--bg); color: var(--text); display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600;
}
.photo label svg.i { width: 18px; height: 18px; }
.nophoto {
  margin-top: 8px; height: 120px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
  color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 15px;
}
.nophoto svg.i { width: 28px; height: 28px; }
#unphoto { display: block; margin-left: auto; min-height: 44px; padding: 0 4px; color: var(--muted); font-size: 15px; }
.nophoto + .group { margin-top: 12px; }
.panel .group { margin-top: 8px; }
/* 17 px: under 16 px iOS zooms the page into the field */
#pname {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; text-align: right; border: 0; background: none;
  color: var(--text); padding: 12px 0; outline: none;
}
#pname::placeholder { color: var(--muted); }
/* a form of its own around the field only: see the submit listener */
.r form { flex: 1; min-width: 0; display: flex; margin: 0; }
/* «Место»: a list of its own under the row, as the sort menu, not the system picker */
.pick { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 17px; }
#pplacev { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pplacev.none { color: var(--muted); }
.pick svg.i { width: 16px; height: 16px; color: var(--muted); transition: transform .2s; }
.r[aria-expanded="true"] .pick svg.i { transform: rotate(180deg); }
.opts > * {
  position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 44px;
  padding: 0 12px 0 24px; text-align: left;
}
.opts > * + * { border-top: 1px solid var(--line); }
/* «Пересажено», «Удобрено»: how many times, as «История»; under the row «Сегодня», «Другой день…», then the days */
.when { color: var(--muted); font-size: 15px; white-space: nowrap; }
#pcare .opts > * { color: var(--accent); }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 44px; height: 44px; border-radius: 10px; background: var(--line); font-size: 22px; }
.step button:disabled { color: var(--muted); }
#pevery { min-width: 80px; text-align: center; font-variant-numeric: tabular-nums; }
#pnext { text-align: right; }
.big {
  width: 100%; min-height: 50px; margin-top: 4px; border-radius: 14px; background: var(--accent); color: var(--accent-text);
  font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.big:disabled { background: var(--line); color: var(--muted); }
.big.done:disabled { color: var(--text); }
.ghost {
  position: relative; min-height: 44px; margin: 4px 0; color: var(--accent); font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
/* the native date picker opens from the field itself; it lies unseen over the text button */
:is(.ghost, .opts) input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; -webkit-appearance: none; }
/* a day in the lists slides left over «Удалить», as a track does (dayRow); 44 pt, the button's target */
.hist { padding-bottom: 8px; color: var(--muted); font-size: 15px; }
.hist > div { position: relative; overflow: hidden; }
.hist .front { min-height: 44px; padding: 0 12px; justify-content: space-between; gap: 8px; }
.hist .open .front { transform: translateX(calc(-1 * var(--acts, 72px))); }
#pdel { width: 100%; min-height: 44px; color: var(--danger); font-size: 15px; }
#pdel.sure { font-weight: 600; }
/* Lucide: outlines in the text colour */
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
</style>
</head>
<body>
<section id="audioteka" role="tabpanel">
  <div class="head">
    <h2>Аудиотека</h2>
    <label class="add">+ Добавить
      <input type="file" id="pick" accept="audio/*,.opus,.ogg,.oga,.m4a,.mp3,.wav,.aac" multiple hidden>
    </label>
  </div>
  <p id="empty" hidden>Пока пусто. В WhatsApp: удерживайте аудио → «Переслать» → значок «Поделиться» справа внизу → «Сохранить в Файлы». Потом здесь «+ Добавить».</p>
  <ul id="list"></ul>
  <p id="usage"></p>
</section>
<section id="flowers" role="tabpanel" hidden>
  <div class="head">
    <h2>Цветы</h2>
    <button type="button" class="add" id="addplant">+ Добавить</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="sortrow" id="sortrow"><span id="pcount"></span><button type="button" class="sortb" id="psort" aria-expanded="false"></button></div>
  <div class="group" id="sortmenu" hidden>
    <button type="button" class="r" data-sort="due">По сроку</button>
    <button type="button" class="r" data-sort="name">По имени</button>
    <button type="button" class="r" data-sort="place">По месту</button>
  </div>
  <p id="pempty" hidden></p>
  <ul id="plants"></ul>
</section>
<div id="bottom">
<footer id="player" hidden>
  <div class="row">
    <button type="button" class="play" id="toggle" aria-label="Пауза"></button>
    <div class="body">
      <div class="name" id="now"></div>
      <div class="meta" id="time"></div>
    </div>
    <button type="button" class="tool loop" id="loop"></button>
  </div>
  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div id="band" hidden></div>
  </div>
</footer>
<nav id="tabs" role="tablist">
  <button type="button" role="tab" data-tab="audioteka" aria-controls="audioteka" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>Аудиотека</button>
  <button type="button" role="tab" data-tab="flowers" aria-controls="flowers" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1"/><circle cx="12" cy="8" r="2"/><path d="M12 10v12"/><path d="M12 22c4.2 0 7-1.667 7-5-4.2 0-7 1.667-7 5Z"/><path d="M12 22c-4.2 0-7-1.667-7-5 4.2 0 7 1.667 7 5Z"/></svg>Цветы</button>
</nav>
</div>
<div id="toast" role="status"><span id="said"></span><button type="button" id="undo" hidden>Отменить</button></div>
<div id="sheet" hidden>
  <div class="dim" id="dim"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="stitle">
    <div class="grab"></div>
    <div class="shead"><h3 id="stitle"></h3><button type="button" class="tool" id="sclose" aria-label="Закрыть"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div id="sphoto"></div>
    <input type="file" id="photo" accept="image/*" hidden>
    <div class="group">
      <div class="r"><label class="k" for="pname">Название</label><form autocomplete="off" onsubmit="return false"><input id="pname" enterkeyhint="done" autocomplete="off" placeholder="Монстера"></form></div>
      <button type="button" class="r" id="pplace" aria-haspopup="listbox" aria-expanded="false"><span class="k">Место</span><span class="pick"><span id="pplacev"></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
      <div class="opts" id="pplaces" role="listbox" hidden></div>
      <div class="r"><span class="k">Поливать каждые</span><span class="step"><button type="button" id="less" aria-label="Меньше">−</button><span id="pevery"></span><button type="button" id="more" aria-label="Больше">+</button></span></div>
      <div class="r"><span class="k">Следующий полив</span><span id="pnext"></span></div>
    </div>
    <div id="old">
      <button type="button" class="big" id="pwater"></button>
      <label class="ghost"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>Полил в другой день…<input type="date" id="pday" aria-label="Полил в другой день"></label>
      <div class="group" id="phist"></div>
      <div class="group" id="pcare">
        <button type="button" class="r" aria-expanded="false"><span class="k">Пересажено</span><span class="pick"><span class="when" id="prepotted"></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
        <div class="opts" hidden><button type="button" data-care="repotted">Сегодня</button><label>Другой день…<input type="date" data-care="repotted"></label></div>
        <div class="hist" id="prepotteds" hidden></div>
        <button type="button" class="r" aria-expanded="false"><span class="k">Удобрено</span><span class="pick"><span class="when" id="pfed"></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
        <div class="opts" hidden><button type="button" data-care="fed">Сегодня</button><label>Другой день…<input type="date" data-care="fed"></label></div>
        <div class="hist" id="pfeds" hidden></div>
      </div>
      <button type="button" id="pdel"></button>
    </div>
    <button type="button" class="big" id="pcreate" hidden>Добавить</button>
  </div>
</div>
<audio id="audio" preload="auto"></audio>
<script>
// release.sh writes the commit here, as in sw.js
const VERSION = "8a88f5e";
const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
// Lucide, inline: no loading from outside
const icon = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const PENCIL = icon('<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>');
const TRASH = icon('<path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>');
// WhatsApp hands over .opus with an empty type now and then; the type decides whether WebKit tries
const TYPES = {opus: "audio/ogg", ogg: "audio/ogg", oga: "audio/ogg", m4a: "audio/mp4", mp3: "audio/mpeg",
               wav: "audio/wav", aac: "audio/aac"};
const $ = id => document.getElementById(id);
// Every field sits in a form of its own and every button is type=button. Without a form Safari takes the page for
// one big form, reads the words next to a field as its label and offers «AutoFill Contact» over the keyboard instead
// of word suggestions; autocomplete="off" it ignores (dash-hub e7f61da). A submit goes nowhere.
document.addEventListener("submit", e => e.preventDefault());
const audio = $("audio");
let tracks = [], current = null, url = null, sure = null, sureTimer, editing = null;

// IndexedDB: a track is {id, name, type, size, added, data: ArrayBuffer}
// (an ArrayBuffer, not the File: older WebKit lost Blobs kept in IndexedDB).
// Version 2 adds the plants (Цветы). An upgrade only adds what is missing: the tracks on the phone stay.
// A base newer than this code (a release rolled back) is opened as it is, with whatever stores it has.
const db = new Promise((ok, fail) => {
  const open = version => {
    const r = version ? indexedDB.open("verstak", version) : indexedDB.open("verstak");
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("tracks")) d.createObjectStore("tracks", {keyPath: "id"});
      if (!d.objectStoreNames.contains("plants")) d.createObjectStore("plants", {keyPath: "id"});
    };
    r.onsuccess = () => {
      // a newer release in another window wants to upgrade: let it
      r.result.onversionchange = () => r.result.close();
      ok(r.result);
    };
    r.onerror = () => r.error?.name === "VersionError" && version ? open() : fail(r.error);
    // an older page in another window holds the base and does not let go
    r.onblocked = () => toast("Закройте другие окна Верстака");
  };
  open(2);
});
async function store(mode, fn, name = "tracks") {
  const d = await db;
  if (!d.objectStoreNames.contains(name)) {
    if (mode === "readonly") return [];
    throw new Error(`no store ${name}`);
  }
  const t = d.transaction(name, mode);
  const req = fn(t.objectStore(name));
  return new Promise((ok, fail) => {
    t.oncomplete = () => ok(req && req.result);
    t.onerror = () => fail(t.error);
  });
}
const all = () => store("readonly", s => s.getAll());
const put = tr => store("readwrite", s => s.put(tr));
const del = id => store("readwrite", s => s.delete(id));

// text is a string, or two lines for a toast with a name (ux.md: a toast is at most two lines): a line is a string
// or its parts, where {cut: name} is a name in bold that gives way, cut short with «…».
// undo, if given, is offered as «Отменить» for 5 s.
function toast(text, undo) {
  const t = $("toast"), said = $("said"), two = Array.isArray(text);
  said.classList.toggle("two", two);
  if (!two) said.textContent = text;
  else said.replaceChildren(...text.map(line => {
    const d = document.createElement("div");
    for (const part of [line].flat()) {
      if (typeof part === "string") { d.append(part); continue; }
      const b = document.createElement("b");
      b.textContent = part.cut;
      d.append(b);
    }
    return d;
  }));
  $("undo").hidden = !undo;
  t.classList.toggle("act", !!undo);
  toast.undo = undo;
  t.classList.add("show");
  document.documentElement.style.setProperty("--toast", t.offsetHeight + 10 + "px");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { t.classList.remove("show"); toast.undo = null; }, undo ? 5000 : 3500);
}
$("undo").addEventListener("click", () => {
  const undo = toast.undo;
  toast.undo = null;
  clearTimeout(toast.h);
  $("toast").classList.remove("show");
  undo?.();
});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ext = n => (n.match(/\.([a-z0-9]+)$/i) || [])[1]?.toLowerCase() || "";
const mb = b => (b / 1048576).toFixed(b < 1048576 ? 2 : 1) + " МБ";
const clock = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "–:––";
// «25 окт.» never breaks between the number and the month
const day = t => new Date(t).toLocaleDateString("ru-RU", {day: "numeric", month: "short"}).replace(" ", "\u00a0");

function render() {
  // a rebuild would drop the rename box without a blur (WebKit), losing the edit; finish() renders after it
  if (editing) return;
  const list = $("list");
  list.replaceChildren();
  $("empty").hidden = tracks.length > 0;
  for (const tr of tracks) {
    const li = document.createElement("li");
    li.dataset.id = tr.id;
    li.classList.toggle("on", current === tr.id);
    li.classList.toggle("open", opened === tr.id);
    const playing = current === tr.id && !audio.paused;
    li.innerHTML = `<div class="acts"><button type="button" data-act="rename">${PENCIL}Переименовать</button>
        <button type="button" class="del" data-act="delete" aria-label="${sure === tr.id ? "Удалить: точно?" : "Удалить"}">${TRASH}${sure === tr.id ? "точно?" : "Удалить"}</button></div>
      <div class="front"><button type="button" class="play" data-act="play" aria-label="${playing ? "Пауза" : "Играть"}">${playing ? PAUSE : PLAY}</button>
      <div class="body" data-act="play"><div class="name"></div><div class="meta">${tr.dur ? clock(tr.dur) + " · " : ""}${mb(tr.size)} · ${day(tr.added)}</div></div></div>`;
    li.querySelector(".name").textContent = tr.name;
    list.append(li);
  }
  usage();
}

async function usage() {
  const total = tracks.reduce((n, t) => n + t.size, 0);
  $("usage").textContent = (tracks.length ? `${tracks.length} · ${mb(total)} · ` : "") + `версия ${VERSION}`;
}

async function load() {
  tracks = (await all()).sort((a, b) => b.added - a.added);
  render();
}

$("pick").addEventListener("change", async e => {
  const files = [...e.target.files];
  e.target.value = "";
  let bad = [];
  for (const f of files) {
    // the picker may report a type the browser does not know (audio/opus, application/octet-stream)
    // although it plays the file; then the extension decides
    const type = audio.canPlayType(f.type) ? f.type : TYPES[ext(f.name)] || f.type || "audio/mpeg";
    if (!audio.canPlayType(type)) bad.push(`«${f.name.replace(/\.[^.]+$/, "")}»`);
    await put({id: uid(), name: f.name.replace(/\.[^.]+$/, ""), type, size: f.size, added: Date.now(),
               data: await f.arrayBuffer()});
  }
  // keep the library through Safari's storage cleanup; a home-screen app gets it without asking
  navigator.storage?.persist?.();
  await load();
  toast(bad.length ? ["Добавлено, но может не играть:", [{cut: bad.join(", ")}]]
                   : files.length === 1 ? "Трек добавлен" : `Добавлено треков: ${files.length}`);
});

// Swiping a track left uncovers «Переименовать» and «Удалить». A long swipe does nothing by itself: deleting cannot
// be undone (ux.md Пр 7), so it stays two taps. The direction is decided after 10 px; up and down is the page's scroll.
// One row is open at a time; a tap anywhere else, a scroll or the other tab closes it.
let ACTS = 144, opened = null, drag = null, swiped = false;
function shut() {
  if (opened === null) return;
  opened = null;
  for (const li of $("list").children) li.classList.remove("open");
}
$("list").addEventListener("pointerdown", e => {
  const front = e.target.closest(".front");
  swiped = false;
  if (!front || editing) return;
  const id = front.parentNode.dataset.id;
  // measured here, not in render(): a list rendered on the hidden tab has no width
  ACTS = front.previousElementSibling.offsetWidth;
  $("list").style.setProperty("--acts", ACTS + "px");
  drag = {id, front, pid: e.pointerId, x: e.clientX, y: e.clientY, from: opened === id ? -ACTS : 0, to: null, dir: null};
});
$("list").addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.dir) {
    if (Math.hypot(dx, dy) < 10) return;
    drag.dir = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (drag.dir === "y") { drag = null; return; }
    if (opened !== drag.id) shut();
    drag.front.setPointerCapture(e.pointerId);
    drag.front.style.transition = "none";
  }
  // past the buttons the row lags behind the finger: there is nothing further to reach
  let x = Math.min(0, drag.from + dx);
  if (x < -ACTS) x = -ACTS + (x + ACTS) / 4;
  drag.to = x;
  drag.front.style.transform = `translateX(${x}px)`;
});
function dragEnd(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  drag = null;
  if (d.dir !== "x") return;
  // the lift after a swipe is not a tap
  swiped = true;
  d.front.style.transition = d.front.style.transform = "";
  opened = (d.to ?? d.from) < -ACTS / 2 ? d.id : null;
  for (const li of $("list").children) li.classList.toggle("open", li.dataset.id === opened);
}
$("list").addEventListener("pointerup", dragEnd);
$("list").addEventListener("pointercancel", dragEnd);
addEventListener("pointerdown", e => {
  // the open row's own taps are handled by its click: the buttons act, the row itself closes
  if (opened !== null && e.target.closest?.("#list li")?.dataset.id !== opened) shut();
}, true);
addEventListener("scroll", shut, {passive: true});

$("list").addEventListener("click", async e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  const li = e.target.closest("li");
  if (!li || li.querySelector("input")) return;
  if (swiped) { swiped = false; return; }
  if (li.dataset.id === opened && e.target.closest(".front")) return shut();
  if (!act) return;
  const tr = tracks.find(t => t.id === li.dataset.id);
  if (act === "play") play(tr);
  else if (act === "rename") { shut(); rename(li, tr); }
  else if (act === "delete") {
    // no confirm(): a second tap within 4 s, as in dash-hub
    if (sure !== tr.id) {
      sure = tr.id;
      clearTimeout(sureTimer);
      sureTimer = setTimeout(() => { sure = null; render(); }, 4000);
      return render();
    }
    sure = null;
    opened = null;
    clearTimeout(sureTimer);
    if (current === tr.id) stop();
    await del(tr.id);
    await load();
    toast("Удалено");
  }
});

function rename(li, tr) {
  const box = li.querySelector(".name");
  const input = document.createElement("input");
  input.value = tr.name;
  input.enterKeyHint = "done";
  input.autocomplete = "off";
  const form = document.createElement("form");
  form.autocomplete = "off";
  form.onsubmit = () => false;
  form.append(input);
  box.replaceChildren(form);
  editing = tr.id;
  input.focus();
  input.select();
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    const name = input.value.trim();
    if (save && name && name !== tr.name) {
      tr.name = name;
      if (current === tr.id) { $("now").textContent = name; meta(tr); }
      await put(tr);
    }
    editing = null;
    render();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") finish(true);
    if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}

function meta(tr) {
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: tr.name, artist: "Верстак"});
}

function play(tr) {
  if (current === tr.id) return audio.paused ? audio.play() : audio.pause();
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(new Blob([tr.data], {type: tr.type}));
  current = tr.id;
  unloop();
  audio.src = url;
  audio.play().catch(err => { if (err.name !== "AbortError") failed(tr); });
  $("now").textContent = tr.name;
  $("player").hidden = false;
  meta(tr);
  render();
}

function stop() {
  audio.pause();
  audio.removeAttribute("src");
  if (url) URL.revokeObjectURL(url);
  url = current = null;
  unloop();
  $("player").hidden = true;
}

// A–B repeat for learning a part: the first tap marks A, the second marks B and jumps back to A, the third clears.
// Every track starts from the beginning without a loop.
let loopA = null, loopB = null;
function unloop() { loopA = loopB = null; loopShow(); }
function loopShow() {
  const b = $("loop"), band = $("band"), d = audio.duration;
  b.className = "tool loop" + (loopB !== null ? " ab" : loopA !== null ? " a" : "");
  b.textContent = loopA !== null && loopB === null ? "B" : "A–B";
  b.setAttribute("aria-label", loopB !== null ? "Убрать повтор" : loopA !== null ? "Конец повтора" : "Начало повтора");
  band.hidden = loopA === null || !isFinite(d) || !d;
  if (band.hidden) return;
  // while B is not set yet, the stretch follows the playhead
  const end = Math.max(loopB ?? audio.currentTime, loopA);
  band.style.left = `calc(14px + (100% - 28px) * ${loopA / d})`;
  band.style.width = `calc((100% - 28px) * ${(end - loopA) / d})`;
}
function loopCheck() {
  if (loopB !== null && audio.currentTime >= loopB) audio.currentTime = loopA;
}
// timeupdate comes about four times a second, late enough to hear past B; a frame loop catches B on time
// while the page is on screen, timeupdate covers the lock screen
function loopTick() {
  if (audio.paused || loopB === null) return;
  loopCheck();
  requestAnimationFrame(loopTick);
}
$("loop").addEventListener("click", () => {
  const t = audio.currentTime;
  if (loopB !== null) { unloop(); return toast("Повтор выключен"); }
  if (loopA === null) {
    loopA = t;
    toast(`Начало повтора ${clock(t)}. Нажмите ещё раз в конце фрагмента`);
  } else if (Math.abs(t - loopA) < 1) {
    return toast("Фрагмент короче секунды. Отметьте конец позже");
  } else {
    [loopA, loopB] = [Math.min(loopA, t), Math.max(loopA, t)];
    audio.currentTime = loopA;
    toast(`Повтор ${clock(loopA)}–${clock(loopB)}`);
    loopTick();
  }
  loopShow();
});

function failed(tr) {
  toast([["Не играет: «", {cut: tr.name}, "»"], "Формат не поддерживается"]);
  stop();
  render();
}

audio.addEventListener("error", () => { const tr = tracks.find(t => t.id === current); if (tr) failed(tr); });
audio.addEventListener("loadedmetadata", async () => {
  // the length is known once WebKit has read the file; keep it for the list
  const tr = tracks.find(t => t.id === current);
  loopShow();
  if (tr && isFinite(audio.duration) && tr.dur !== audio.duration) { tr.dur = audio.duration; await put(tr); render(); }
});
for (const ev of ["play", "pause"]) audio.addEventListener(ev, () => {
  $("toggle").innerHTML = audio.paused ? PLAY : PAUSE;
  $("toggle").setAttribute("aria-label", audio.paused ? "Играть" : "Пауза");
  if (ev === "play") loopTick();
  render();
});
// a B at the very end is never passed: the track ends first
audio.addEventListener("ended", () => {
  audio.currentTime = loopB !== null ? loopA : 0;
  if (loopB !== null) audio.play();
});
audio.addEventListener("timeupdate", () => {
  loopCheck();
  if (!seeking) $("seek").value = audio.duration ? audio.currentTime / audio.duration * 1000 : 0;
  $("time").textContent = clock(audio.currentTime) + " / " + clock(audio.duration);
  if (loopA !== null && loopB === null) loopShow();
});
let seeking = false;
$("seek").addEventListener("input", () => { seeking = true; });
$("seek").addEventListener("change", () => {
  if (audio.duration) audio.currentTime = $("seek").value / 1000 * audio.duration;
  seeking = false;
});
$("toggle").addEventListener("click", () => audio.paused ? audio.play() : audio.pause());

// The player and the tabs are one fixed block; the page and the toast end above it, whatever it holds
new ResizeObserver(() => document.documentElement.style.setProperty("--bottom", $("bottom").offsetHeight + "px"))
  .observe($("bottom"));

// localStorage may throw (storage blocked); then everything opens at its default
function pref(key, value) {
  try {
    if (value === undefined) return localStorage.getItem("verstak." + key);
    localStorage.setItem("verstak." + key, value);
  } catch {}
  return null;
}

// Tabs only show and hide sections: the player, the sound, A–B and the lock screen are outside them.
// Each tab keeps its own scroll position.
const scrolled = {};
function tab(name) {
  const now = document.querySelector('#tabs [aria-selected="true"]').dataset.tab;
  if (now !== name) scrolled[now] = scrollY;
  shut();
  for (const b of $("tabs").children) {
    b.setAttribute("aria-selected", b.dataset.tab === name);
    $(b.dataset.tab).hidden = b.dataset.tab !== name;

  pref("tab", name);

$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) tab(b.dataset.tab); });

// of a small JPEG, as with tracks.

const SORTS = {due: "по сроку", name: "по имени", place: "по месту"};
const DROP = icon('<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>');
const CHECK = icon('<path d="M20 6 9 17l-5-5"/>');
const FLOWER = icon('<path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1"/><circle cx="12" cy="8" r="2"/><path d="M12 10v12"/><path d="M12 22c4.2 0 7-1.667 7-5-4.2 0-7 1.667-7 5Z"/><path d="M12 22c-4.2 0-7-1.667-7-5 4.2 0 7 1.667 7 5Z"/>');

const IMAGE_PLUS = icon('<path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/>');
const savePlant = p => store("readwrite", s => s.put(p), "plants");
let plants = [], filter = pref("filter") || "all", sort = SORTS[pref("sort")] ? pref("sort") : "due";

// Days are the phone's calendar days: a watering at 23:50 and one at 00:10 are two days. Dates step by the
// calendar, not by 24 h, so the change to summer time does not move them.
const dayOf = t => new Date(t).setHours(0, 0, 0, 0);
const plus = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.setHours(0, 0, 0, 0); };
const between = (a, b) => Math.round((dayOf(b) - dayOf(a)) / 86400000);
const iso = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const next = p => p.history.length ? plus(p.history[0], p.every) : null;
// days until the next watering; a plant never watered goes before every other
const left = p => p.history.length ? between(Date.now(), next(p)) : -Infinity;
const today = p => p.history.length > 0 && dayOf(p.history[0]) === dayOf(Date.now());
const due = p => !today(p) && left(p) <= 0;
const plural = (n, one, few, many) => {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
};
const days = n => n + " " + plural(n, "день", "дня", "дней");
// «12 мар. 2025»: a day of another year says the year
const dated = t => day(t) + (new Date(t).getFullYear() === new Date().getFullYear() ? "" : " " + new Date(t).getFullYear());

// («18 мес.» with a day of another year does not fit the row)
function since(t) {
  const n = between(t, Date.now()), a = new Date(t), b = new Date();
  const m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() - (b.getDate() < a.getDate());
  if (!n) return "сегодня";
  if (m < 2) return days(n) + " назад";
  if (m < 12) return m + " мес. назад";
  const y = Math.floor(m / 12);
  return y + " " + plural(y, "год", "года", "лет") + " назад";

const CARE = {repotted: "пересажено", fed: "удобрено"};

const times = n => n + " " + plural(n, "раз", "раза", "раз");

const dayRow = (k, t, date, ago) => `<div data-k="${k}" data-t="${t}"><div class="acts"><button type="button" class="del">${TRASH}Удалить</button></div>
  <div class="front"><span>${date}</span><span>${ago}</span></div></div>`;
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
function when(p) {
  if (!p.history.length) return "<b>ещё не поливали</b>";

const pics = new Map();

    unpic(p.id);

    pics.set(p.id, e);

// a phone photo is 12 MP; 800 px on the long side is plenty for the circle and the card, and keeps the base small
async function shrink(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = src;
    await img.decode();
    const k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k);
    c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.8));
    if (!blob) throw new Error("no JPEG");
    return await blob.arrayBuffer();
  } finally {
    URL.revokeObjectURL(src);

function renderPlants() {

  const places = [...new Set([...PLACES, ...plants.map(p => p.place).filter(Boolean)])]
    .filter(pl => plants.some(p => p.place === pl));
  // a place filter outlives its last plant only until the next look
  if (filter !== "all" && filter !== "due" && !places.includes(filter)) filter = "all";
  const chip = (key, label, n) => `<button type="button" class="chip${filter === key ? " on" : ""}" data-filter="${key}" aria-pressed="${filter === key}">${label}${n === undefined ? "" : ` <span class="n">${n}</span>`}</button>`;
  $("chips").innerHTML = chip("all", "Все", plants.length) + chip("due", "Полить", plants.filter(due).length)
    + places.map(pl => chip(pl, pl)).join("");

  const by = {

    due: (a, b) => left(a) - left(b) || a.name.localeCompare(b.name, "ru"),
    name: (a, b) => a.name.localeCompare(b.name, "ru"),
    place: (a, b) => rank(a) - rank(b) || by.due(a, b),

      <span class="pic">${url ? `<img src="${url}" alt="">` : FLOWER}</span>

  sheet.fresh = false;
  closeSheet();
  // the new plant has to be in sight: a place filter it does not match gives way to «Все»
  if (PLACES.includes(filter) && filter !== p.place) pref("filter", filter = "all");
  renderPlants();
  navigator.storage?.persist?.();
});

// A new release takes over on its own (sw.js), but this page still runs the old code. It reloads into the new one
// only when that cuts nothing off: at once when no track is open (a fresh start), or on coming back after
// IDLE in the background until the first tap — never while a track plays, a rename is open or a plant card is
// (a new plant there is only a draft).
// Without the network nothing changes.
const IDLE = 30 * 60 * 1000;
if ("serviceWorker" in navigator) {
  let had = !!navigator.serviceWorker.controller, stale = false, left = 0, rested = false;
  const reloadIfIdle = () => {
    if (stale && audio.paused && !editing && !sheet && (current === null || rested)) location.reload();
  };
  addEventListener("pointerdown", () => { rested = false; }, true);
  navigator.serviceWorker.register("sw.js").then(reg => {
    // a home-screen app comes back from the background without loading the page, so look again then
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { left = Date.now(); return; }
      rested = left > 0 && Date.now() - left > IDLE;
      reloadIfIdle();
      reg.update().catch(() => {});
    });
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    // the first install takes control too; only a change from one release to another makes this page stale
    if (had) { stale = true; reloadIfIdle(); }
    had = true;
  });
}
loopShow();
tab(pref("tab") === "flowers" ? "flowers" : "audioteka");
load();
loadPlants();
</script>
</body>
</html>
